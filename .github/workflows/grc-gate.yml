# .github/workflows/grc-gate.yml
name: grc-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write       # required for AWS OIDC + Cosign keyless (Lab 4.4) - to request an OIDC token from GitHub Actions
  contents: read
  pull-requests: write  # required to comment on the PR

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: terraform/primitives/compliant-s3

jobs:
  grc-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Install Conftest
        run: |
          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.50.0/conftest_0.50.0_Linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin conftest

      - name: Install tfsec
        run: |
          curl -fsSL https://github.com/aquasecurity/tfsec/releases/download/v1.28.14/tfsec-linux-amd64 \
            -o /usr/local/bin/tfsec && chmod +x /usr/local/bin/tfsec

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false
          terraform validate
          # Same vars as Lab 2.3 / 3.4. -input=false means missing vars fail the job
          # instead of hanging on an interactive prompt the runner can't answer.
          terraform plan -out=tfplan -input=false -no-color \
            -var="project_name=cgep-lab" -var="environment=dev" | tee plan.txt
          terraform show -json tfplan > plan.json

      - name: Conftest policy gate
        id: conftest
        run: |
          mkdir -p evidence/lab-4-3
          EXIT=0
          {
            echo "["
            FIRST=1
            # AWS namespaces only (same set as scripts/policy-gate.sh from Lab 3.4).
            for ns in compliance.sc28_aws compliance.ac3_aws compliance.cm6_aws ; do
              [[ $FIRST -eq 1 ]] && FIRST=0 || printf ","
              set +e
              OUT=$(conftest test --policy policies --namespace "$ns" --output=json "$TF_WORKING_DIR/plan.json")
              STATUS=$?
              set -e
              [[ $STATUS -eq 0 ]] || EXIT=1
              printf '%s' "$OUT"
            done
            echo
            echo "]"
          } > evidence/lab-4-3/conftest-results.json
          if [[ $EXIT -eq 0 ]]; then echo "conftest: PASS"; else echo "conftest: FAIL"; exit 1; fi

      # if: always() — default Actions behavior skips later steps when an earlier
      # step fails (e.g. conftest exit 1). always() still runs this step so a
      # failed gate still produces evidence — the runs you most want a record of.
      - name: tfsec scan
        id: tfsec
        if: always()
        run: |
          # Write SARIF for the artifact, then re-run with a severity floor so
          # tfsec's own exit code is the gate (no JSON parsing required).
          tfsec "$TF_WORKING_DIR" --format sarif --out evidence/lab-4-3/tfsec.sarif || true
          tfsec "$TF_WORKING_DIR" --minimum-severity HIGH

      # By default, Github Actions run only if every previous step in the job succeeded.
      # This step runs even if the previous steps failed, so we can capture the plan for evidence.
      - name: Copy plan into evidence
        if: always()
        run: |
          cp "$TF_WORKING_DIR"/plan.json evidence/lab-4-3/plan.json
          cp "$TF_WORKING_DIR"/plan.txt  evidence/lab-4-3/plan.txt

      # Sign + upload even when conftest/tfsec failed (if: always()). Job failure
      # is deferred to the final "Enforce gate" step so failed runs still leave
      # a signed vault receipt. OIDC role needs vault-write (s3:PutObject on the
      # vault bucket) in addition to ReadOnlyAccess from oidc-trust/main.tf.
      - name: Bundle + sign + upload to vault
        id: sign
        if: always()
        env:
          # Repo Actions variable (gh variable set EVIDENCE_VAULT --body "$VAULT").
          # Not a secret — just the evidence bucket name for aws s3 cp.
          VAULT: ${{ vars.EVIDENCE_VAULT }}
          RUN_ID: ${{ github.run_id }}
          # Built-in context: commit SHA for this run. On pull_request it is the
          # merge commit GitHub creates to test the PR; on workflow_dispatch/push
          # it is the commit that was checked out.
          SHA: ${{ github.sha }}
        run: |
          # -e exit on error; -u error on unset vars; -o pipefail fail if any
          # stage in a pipeline fails (not only the last command).
          set -euo pipefail
          
          # Prefer Linux sha256sum; fall back to macOS-style shasum -a 256.
          # command -v: exit 0 if tool is on PATH. >/dev/null discards the path
          # print; 2>&1 also discards stderr so "not found" stays quiet.

          if command -v sha256sum >/dev/null 2>&1; then SHASUM="sha256sum"
          elif command -v shasum >/dev/null 2>&1; then SHASUM="shasum -a 256"
          # >&2 sends the error message to stderr (fd 2), not stdout.
          else echo "Need sha256sum or shasum" >&2; exit 2; fi

          BUNDLE="evidence-${RUN_ID}-${SHA}.tar.gz"
          ( cd evidence/lab-4-3 && tar czf "../../${BUNDLE}" . )
          # shasum/sha256sum print "<hash>  <filename>"; awk '{print $1}' keeps
          # only the hex digest, then write it to the .sha256 sidecar file.
          $SHASUM "${BUNDLE}" | awk '{print $1}' > "${BUNDLE}.sha256"

          cosign sign-blob --yes --bundle "${BUNDLE}.sig.bundle" "${BUNDLE}"

          KEY_PREFIX="runs/${RUN_ID}"
          aws s3 cp "${BUNDLE}"            "s3://${VAULT}/${KEY_PREFIX}/${BUNDLE}"
          aws s3 cp "${BUNDLE}.sha256"     "s3://${VAULT}/${KEY_PREFIX}/${BUNDLE}.sha256"
          aws s3 cp "${BUNDLE}.sig.bundle" "s3://${VAULT}/${KEY_PREFIX}/${BUNDLE}.sig.bundle"

          # Not computed locally — AWS assigns VersionId when the vault bucket
          # has versioning. head-object returns that ID so the receipt pins the
          # exact immutable object version (content hash is sha256 below).
          VERSION_ID=$(aws s3api head-object --bucket "${VAULT}" --key "${KEY_PREFIX}/${BUNDLE}" --query VersionId --output text)
          cat > receipt.json <<EOF
          {
            "run_id":"${RUN_ID}",
            "vault":"${VAULT}",
            "bundle_key":"${KEY_PREFIX}/${BUNDLE}",
            "version_id":"${VERSION_ID}",
            "sha256":"$(cat ${BUNDLE}.sha256)",
            "commit":"${SHA}"
          }
          EOF
          aws s3 cp receipt.json "s3://${VAULT}/${KEY_PREFIX}/receipt.json"
          mkdir -p evidence/lab-4-4
          cp receipt.json evidence/lab-4-4/receipt.json

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grc-evidence-${{ github.run_id }}
          path: |
            evidence/lab-4-3/
            evidence/lab-4-4/
          retention-days: 90

      # Verdict last: evidence already signed/uploaded above. steps.<id>.outcome
      # is success|failure|cancelled|skipped (set by Actions before the shell runs).
      # test A = B exits 0 if equal, 1 otherwise. && runs the right side only if
      # the left succeeded — both gates must be success or this step (and job) fails.
      - name: Enforce gate
        if: always()
        run: |
          test "${{ steps.conftest.outcome }}" = "success" \
            && test "${{ steps.tfsec.outcome }}" = "success"

  # pinned versions of the actions used in this workflow:
  # actions/checkout@v4
  # aws-actions/configure-aws-credentials@v4
  # hashicorp/setup-terraform@v3
  # Tags in git are mutable references. @v4 or @v3 means "latest v4 or v3 release", which is not guaranteed to be stable.
  # Or if the maintainer deletes the tag, or compromises their account, the workflow could break. Pinning to a specific commit hash is more stable.
  # Standard practice for supply chain hardening
  